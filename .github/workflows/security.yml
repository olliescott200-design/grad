name: security-ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"
      - if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

  bandit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r . -f sarif -o bandit.sarif || true
      - if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: bandit.sarif }

  pip_audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f sarif -o pip-audit.sarif || true
          else
            pip-audit -f sarif -o pip-audit.sarif || true
          fi
      - if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: pip-audit.sarif }

  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: --report-format sarif --report-path gitleaks.sarif
      - if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: gitleaks.sarif }