<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — GradGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-container {
      text-align: center;
      color: white;
      max-width: 600px;
      padding: 2rem;
    }
    .error-code {
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .btn-home {
      background: white;
      color: #667eea;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-top: 1.5rem;
      transition: transform 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="mb-3">Page Not Found</h1>
    <p class="fs-5 mb-4">We couldn't find the page you're looking for. It might have been moved or doesn't exist.</p>
    <a href="/" class="btn-home">← Back to Home</a>
  </div>
</body>
</html>
